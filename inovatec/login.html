<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inovatec - Login de clientes</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topo topo-simples">
  <a class="marca" href="institucional.html">
    <img class="logo" src="logo-inovatec.svg" alt="Logo Inovatec">
  </a>
</header>

<main class="pagina-form">
  <section>
    <h1>Login de clientes</h1>

    <form id="form-login" novalidate>
      <div class="campo">
        <label for="login">Login (e-mail)</label>
        <input type="text" id="login" name="login" autocomplete="username">
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" autocomplete="current-password">
      </div>

      <div class="acoes">
        <button type="submit" id="botao-login" class="botao botao-primario">Realizar Login</button>
        <button type="button" id="botao-limpar" class="botao botao-secundario">Limpar</button>
      </div>

      <div id="mensagem" class="mensagem" role="alert"></div>
    </form>

    <div class="links-auxiliares">
      <a href="troca-senha.html">Esqueci / quero trocar minha senha</a>
      <a href="cadastro.html">Ainda não sou cliente: fazer cadastro</a>
    </div>
  </section>
</main>

<script src="validacoes.js"></script>
<script src="login.js"></script>

</body>
</html>
